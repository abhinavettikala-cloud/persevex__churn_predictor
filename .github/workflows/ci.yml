name: Persevex CI/CD Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Run Python Tests & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Test Suite
        run: |
          python run_all_tests.py

  docker-build-check:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build FastAPI Backend Image (Dockerfile.api)
        run: |
          docker build -f Dockerfile.api -t churn-predictor-api:test .

      - name: Build Streamlit UI Frontend Image (Dockerfile.ui)
        run: |
          docker build -f Dockerfile.ui -t churn-predictor-ui:test .
