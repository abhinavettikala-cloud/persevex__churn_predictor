version: "3.8"

services:
  # FastAPI Microservice Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom_churn_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Streamlit Frontend Web Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom_churn_frontend
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: always
