# ==============================================================================
# Render Blueprint Configuration - Docker Containers Deployment
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Microservice (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: telecom-churn-api
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

  # ----------------------------------------------------------------------------
  # 2. Streamlit Frontend Dashboard (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: telecom-churn-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    region: oregon
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: telecom-churn-api
          property: host
