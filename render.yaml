services:
  - type: web
    name: persevex-churn-predictor-backend
    env: docker
    dockerfilePath: Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "https://persevex-churn-predictor-frontend.onrender.com"
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"

  - type: web
    name: persevex-churn-predictor-frontend
    env: docker
    dockerfilePath: Dockerfile.ui
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_BASE_URL
        value: "https://persevex-churn-predictor-backend.onrender.com"
      - key: ENABLE_FALLBACK
        value: "false"
